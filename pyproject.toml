[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rosettalink"
version = "0.0.0"
#requires-python = ">=3.10,<3.13"
requires-python = ">=3.10,<3.11"
description = "RosettaLink"
readme = "README.md"
dependencies = [
    "biopython",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.10.*"

[tool.pixi.pypi-dependencies]
rosettalink = { path = ".", editable = true }
pyrosetta = { path = "./.wheels/pyrosetta-0.0.dev0-cp310-cp310-linux_x86_64.whl" }

[tool.pixi.tasks]
